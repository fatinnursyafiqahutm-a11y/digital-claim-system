services:
  # Laravel Web Service
  - type: web
    name: digital-claim-system
    env: docker
    repo: https://github.com/fatinnursyafiqahutm-a11y/digital-claim-system.git
    rootDir: .
    dockerfilePath: ./Dockerfile.deploy
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Only set essential environment variables
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: true # Set automatically by Render

  # Persistent Disk for File Storage
  - type: disk
    name: claim-receipts-storage
    mountPath: /var/www/html/storage/app
    sizeGB: 1